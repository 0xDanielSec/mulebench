name: Demo GIF

# Manual only. Records demo/demo.tape with VHS (offline replay of committed
# pilot 08 cassettes: no API key, no network calls to any model provider) and
# uploads docs/assets/demo.gif as a workflow artifact. It never commits or
# pushes; a maintainer downloads the artifact and commits it (demo/README.md).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      MB_LIVE: "" # replay only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Record demo/demo.tape
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          path: demo/demo.tape

      - name: Upload GIF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-gif
          path: docs/assets/demo.gif
          if-no-files-found: error
          retention-days: 14
