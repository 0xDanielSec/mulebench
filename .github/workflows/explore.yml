name: Property exploration

# Weekly run of the Hypothesis property tests with random seeds and more
# examples (profile "explore"). The regular CI uses the derandomized "ci"
# profile. A failure prints a `@reproduce_failure(...)` blob in the log;
# paste it onto the failing test to replay it locally.

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore:
    name: Hypothesis explore
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HYPOTHESIS_PROFILE: explore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Property tests (random seeds)
        # print_blob=True is set by the profile; -rA and --tb=long keep the
        # falsifying example and the reproduction blob in the log.
        run: >-
          uv run pytest tests/ledger/test_properties.py
          -rA --tb=long --hypothesis-show-statistics --hypothesis-verbosity=normal
