name: Weekly mutation check

# Breaks one invariant, attribution, guard, delegation or monitor condition at
# a time (scripts/mutation_check.py) and runs that module's tests. Fails when
# a mutant survives, or when docs/mutation-summary.json (and the README count
# rendered from it) is stale, i.e. a table changed without the summary
# being regenerated.

on:
  schedule:
    - cron: "41 4 * * 1" # Mondays 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Mutation check (every table; fails on a survivor)
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run python scripts/mutation_check.py

      - name: Summary is up to date
        run: |
          if ! git diff --exit-code -- docs/mutation-summary.json; then
            echo "::error::docs/mutation-summary.json is stale: run 'uv run python scripts/mutation_check.py' and commit it"
            exit 1
          fi

      - name: README mutant count matches the summary
        run: uv run pytest tests/test_ablation.py -k mutant
