id: 9f9b8577-ae1f-57a2-b288-859e954bade3
name: 'MB-INV1-authorization_after_transfer: Authorization granted after transfer'
description: The cited authorization was created after the money moved. Generated by `mulebench monitor
  rules --format kql`. Starting point, not production-validated; tactic and ATLAS mappings to be reviewed.
  See docs/monitor-kql.md.
severity: High
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1d
