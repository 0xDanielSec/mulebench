id: 39c4c0c7-34b7-5dca-b15f-f7aa8370f012
name: 'MB-MON-unknown_customer: Session with no authenticated customer'
description: Events arrived for a session that has no session_start, so ownership cannot be judged (fails
  closed). Generated by `mulebench monitor rules --format kql`. Starting point, not production-validated;
  tactic and ATLAS mappings to be reviewed. See docs/monitor-kql.md.
severity: Medium
requiredDataConnectors: []
queryFrequency: 1h
queryPeriod: 1d
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
tags:
- mulebench
- mulebench.monitor
- to be reviewed
query: |
  let MbSessions = MulebenchTrace_CL
      | where EventType == "session_start"
      | summarize arg_max(TimeGenerated, CustomerId) by SessionId
      | project SessionId, SessionCustomer = CustomerId;
  MulebenchTrace_CL
  | where EventType in ("tool_call", "confirmation", "customer_message", "final_answer",
      "session_end", "ledger.transfer") and isnotempty(SessionId)
  | summarize CallSeq = make_set_if(Seq, EventType == "tool_call"),
      TimeGenerated = max(TimeGenerated) by SessionId
  | join kind=leftanti MbSessions on SessionId
  | extend CustomerId = "", TransferIds = dynamic([]), Accounts = dynamic([]),
      AmountCents = long(null)
  | extend RuleId = "MB-MON-unknown_customer"
  | extend TransferIds = array_sort_asc(TransferIds), CallSeq = array_sort_asc(CallSeq),
      Accounts = array_sort_asc(Accounts)
  | extend AlertKey = substring(hash_sha256(strcat(RuleId, "|", SessionId, "|",
      strcat_array(TransferIds, ","), "|",
      iff(array_length(TransferIds) == 0, strcat_array(CallSeq, ","), ""), "|",
      iff(array_length(TransferIds) == 0 and array_length(CallSeq) == 0,
          strcat_array(Accounts, ","), ""))), 0, 24)
  | project TimeGenerated, RuleId, SessionId, CustomerId, CallSeq, TransferIds, Accounts, AmountCents, AlertKey
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: CustomerId
customDetails:
  RuleId: RuleId
  SessionId: SessionId
  AlertKey: AlertKey
  TransferIds: TransferIds
  CallSeq: CallSeq
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
