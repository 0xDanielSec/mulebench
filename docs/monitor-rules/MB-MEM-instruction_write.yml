detection:
  selection:
    type: memory_write
    text|re: (standing-order word) AND (action verb); see correlation
  condition: selection
correlation: Case-fold memory_write.text and collapse whitespace. Fire when it contains, as
  whole words, a standing-order word (always, every, whenever, each time, from now on, going
  forward, in future, never, sempre, toda vez, a partir de agora) and an action verb (include,
  send, transfer, pay, forward, share, report, disclose, mention, show, tell, list, move,
  and Portuguese equivalents; full list in the reference implementation), and shares no run
  of 24 characters with a customer_message.text of the same session. Fires at extraction,
  before any later session reads the memory. Lexical.
fields:
- memory_write.text
- customer_message.text
falsepositives:
