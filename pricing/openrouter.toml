# Local price table for --provider openrouter (see docs/openrouter.md).
# Edit by hand. Prices are USD per million tokens, per (model, host provider).
# host = "TBD" means the host is not pinned yet: such an entry never matches,
# so a run cannot start until the host is chosen (with `mulebench doctor
# --provider openrouter`) and priced here.
#
# One host can list several endpoints of a model with different prices. Each
# entry holds the HIGHEST price among the host's endpoints of that model, so
# the cost cap never underestimates; `doctor` fails if an entry is below the
# pinned endpoint's price.

as_of = "2026-11-16"
source = "OpenRouter endpoint listings (GET /api/v1/models/{id}/endpoints); highest eligible endpoint price per model and host (DekaLLM entry read 2026-11-17; pilot 10 entries read 2026-11-18)"

# Not used by pilot 08: DeepInfra rate-limited gpt-oss-20b persistently
# (HTTP 429 after 6 attempts, twice, 2026-11-17).
[[price]]
model = "openai/gpt-oss-20b"
host = "DeepInfra"
input_per_mtok = 0.030
output_per_mtok = 0.140

# pilot 08 pin: quantization bf16 (single eligible endpoint; price as of 2026-11-17)
[[price]]
model = "openai/gpt-oss-20b"
host = "DekaLLM"
input_per_mtok = 0.029
output_per_mtok = 0.140

# pilot 08 pin: quantization fp8
[[price]]
model = "google/gemma-4-26b-a4b-it"
host = "DeepInfra"
input_per_mtok = 0.070
output_per_mtok = 0.340

# pilot 08 pin: quantization fp8
[[price]]
model = "mistralai/mistral-small-3.2-24b-instruct"
host = "DeepInfra"
input_per_mtok = 0.1125
output_per_mtok = 0.300

# pilot 08 pin: quantization fp8 (the only tool-capable DeepInfra endpoint)
[[price]]
model = "qwen/qwen3-14b"
host = "DeepInfra"
input_per_mtok = 0.120
output_per_mtok = 0.240

# Pilot 10 (listing read 2026-11-18, GET /api/v1/models/{id}/endpoints, no key).
# The host pin covers every endpoint tier of the host; tiers cannot be pinned by
# the harness, so each entry is the highest eligible tier's price.

# Anthropic host: one endpoint (tag anthropic); no seed, no temperature.
[[price]]
model = "anthropic/claude-sonnet-5.5"
host = "Anthropic"
input_per_mtok = 2.0
output_per_mtok = 10.0

# OpenAI host: tags openai/flex 0.5/2.5, openai 1/5, openai/fast 2/10 (all with
# tools and seed, none with temperature); priced at openai/fast.
[[price]]
model = "openai/gpt-6.1-terra"
host = "OpenAI"
input_per_mtok = 2.0
output_per_mtok = 10.0

# Google AI Studio host: tags google-ai-studio/flex 0.375/1.875,
# google-ai-studio 0.75/3.75, google-ai-studio/priority 1.35/6.75 (tools, seed
# and temperature; internal reasoning priced as output); priced at priority.
[[price]]
model = "google/gemini-3.8-flash"
host = "Google AI Studio"
input_per_mtok = 1.35
output_per_mtok = 6.75
