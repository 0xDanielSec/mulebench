# Local price table for --provider openrouter (see docs/openrouter.md).
# Edit by hand. Prices are USD per million tokens, per (model, host provider).
# host = "TBD" means the host is not pinned yet: such an entry never matches,
# so a run cannot start until the host is chosen (with `mulebench doctor
# --provider openrouter`) and its own endpoint price is filled in here.
#
# The prices below are the model-level prices listed by OpenRouter's public
# model list on the as_of date, as placeholders. Replace them with the price
# of the pinned host's endpoint when the host is pinned.

as_of = "2026-11-16"
source = "OpenRouter public model list (GET /api/v1/models), model-level prices; hosts not pinned"

[[price]]
model = "openai/gpt-oss-20b"
host = "TBD"
input_per_mtok = 0.030
output_per_mtok = 0.130

